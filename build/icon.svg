<?xml version="1.0" encoding="UTF-8"?>
<!--
  Telos brand mark — Pix-style π on a circular plate.
  - Circle plate (not rounded square)
  - Refined π: tucked stems, optical centering, short right leg
  - Glyph color: Yandex red #FC3F1D
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" id="telos-mark">
  <!-- Inscribed circle; transparent corners for modern OS icons -->
  <circle cx="512" cy="512" r="472" fill="#FFFFFF"/>
  <!-- Soft inner rim so the plate reads on light wallpapers -->
  <circle cx="512" cy="512" r="472" fill="none" stroke="#F0F0F0" stroke-width="8"/>

  <g fill="#FC3F1D" id="telos-pi">
    <!-- crossbar: slight overhang, optically lifted -->
    <rect x="248" y="292" width="528" height="100" rx="50"/>
    <!-- left stem: tucks into crossbar; stem≈gap for small sizes -->
    <rect x="312" y="342" width="96" height="392" rx="48"/>
    <!-- right stem: shorter, same width, same tuck -->
    <rect x="556" y="342" width="96" height="308" rx="48"/>
  </g>
</svg>
