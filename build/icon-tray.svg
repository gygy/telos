<?xml version="1.0" encoding="UTF-8"?>
<!--
  Telos tray mark - inverted for Windows notification area (light background).
  Brand mark (icon.svg) is white plate + red pi; on a light tray the white plate
  disappears and only the red pi remains (~23% fill). Yandex uses a dark filled
  disc (~48% visible-on-light fill). This tray variant uses Yandex-red plate +
  white pi so the whole disc reads at SM_CXSMICON (16 at 100% DPI).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" id="telos-tray-mark">
  <circle cx="512" cy="512" r="508" fill="#FC3F1D"/>
  <g fill="#FFFFFF" id="telos-tray-pi">
    <rect x="188" y="262" width="648" height="124" rx="62"/>
    <rect x="256" y="324" width="124" height="468" rx="62"/>
    <rect x="564" y="324" width="124" height="368" rx="62"/>
  </g>
</svg>
