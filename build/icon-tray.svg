<?xml version="1.0" encoding="UTF-8"?>
<!--
  Telos tray mark — same face as build/icon.svg (Yandex g136 white squircle).
  Kept as a separate file so tray PNG generation stays explicit; geometry must stay in sync.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" id="telos-tray-mark">
  <rect x="0" y="0" width="1024" height="1024" rx="268" fill="#FFFFFF"/>
  <rect x="6" y="6" width="1012" height="1012" rx="262" fill="none" stroke="#E7E7E7" stroke-width="10"/>
  <g fill="#FC3F1D" id="telos-tray-pi">
    <rect x="140" y="220" width="744" height="148" rx="74"/>
    <rect x="210" y="290" width="156" height="530" rx="78"/>
    <rect x="550" y="290" width="156" height="430" rx="78"/>
  </g>
</svg>
