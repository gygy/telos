<?xml version="1.0" encoding="UTF-8"?>
<!--
  Telos tray mark — notification-area companion to icon.svg.
  Matches Yandex browser.exe icon group 136 (light tray style):
  - near-full canvas fill (opaqueFill ~0.98 at 16) so it is not smaller than neighbors
  - soft LIGHT gray rim (#F0F0F0) only — never dark/black
  - white plate + red π (same face as brand; only fill radius differs)
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" id="telos-tray-mark">
  <circle cx="512" cy="512" r="620" fill="#FFFFFF"/>
  <circle cx="512" cy="512" r="506" fill="none" stroke="#F0F0F0" stroke-width="12"/>
  <g fill="#FC3F1D" id="telos-tray-pi">
    <rect x="188" y="262" width="648" height="124" rx="62"/>
    <rect x="256" y="324" width="124" height="468" rx="62"/>
    <rect x="564" y="324" width="124" height="368" rx="62"/>
  </g>
</svg>
