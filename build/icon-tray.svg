<?xml version="1.0" encoding="UTF-8"?>
<!--
  Telos tray mark - white plate + red pi (brand colors).
  make-icon composites this disc at Yandex ratio (~0.938 of the tray canvas).
  Dark rim keeps the white plate readable on a light Windows notification area.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" id="telos-tray-mark">
  <circle cx="512" cy="512" r="500" fill="#FFFFFF"/>
  <circle cx="512" cy="512" r="500" fill="none" stroke="#2B2B2B" stroke-width="40"/>
  <g fill="#FC3F1D" id="telos-tray-pi">
    <rect x="200" y="274" width="624" height="120" rx="60"/>
    <rect x="268" y="334" width="120" height="448" rx="60"/>
    <rect x="556" y="334" width="120" height="352" rx="60"/>
  </g>
</svg>
