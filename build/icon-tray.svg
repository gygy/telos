<?xml version="1.0" encoding="UTF-8"?>
<!--
  Telos tray mark - white plate + red pi, no dark rim.
  Reference: Yandex browser.exe 16px (transparent corners, no black stroke) and
  resources/*.ico (messenger/sxs fill their slot without a dark border ring).
  make-icon composites this disc at Yandex-measured content ratios per size.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" id="telos-tray-mark">
  <circle cx="512" cy="512" r="508" fill="#FFFFFF"/>
  <g fill="#FC3F1D" id="telos-tray-pi">
    <rect x="188" y="262" width="648" height="124" rx="62"/>
    <rect x="256" y="324" width="124" height="468" rx="62"/>
    <rect x="564" y="324" width="124" height="368" rx="62"/>
  </g>
</svg>
