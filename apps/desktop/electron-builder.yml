appId: dev.pix.app
productName: Pix
# package.json name is @pix/desktop — override so AppImage/deb paths stay valid.
executableName: Pix
asar: true
# Native dependencies ship N-API/prebuilt binaries and are exercised under the
# target Electron runtime. Rebuilding node-pty discards those prebuilds and adds
# a Visual Studio Spectre-library requirement to packaging.
npmRebuild: false
files:
  - dist/**
  - package.json
# Runtime window / notification icons (BrowserWindow.icon). Separate from the
# exe-embedded icon from win.icon — both are required on Windows for taskbar.
extraResources:
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon.png
    to: icon.png
  - from: build/icon.icns
    to: icon.icns
directories:
  output: release/app
  buildResources: build
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
# Auto-update via electron-updater + GitHub Releases.
# CI packages with `--publish never` (yml still generated); softprops attaches assets.
#
# Release asset policy (see scripts/release-assets.mjs):
#   installers — exe / dmg×2 / AppImage / deb
#   mac zip×2  — auto-update payload (not dmg)
#   feeds      — latest.yml · latest-mac.yml · latest-linux.yml
#   blockmaps  — differential downloads when electron-builder emits them
#
# app-update.yml is embedded by electron-builder and always by scripts/after-pack.mjs.
publish:
  provider: github
  owner: num-scope
  repo: pix
  releaseType: release
mac:
  identity: null
  icon: icon.icns
  # zip is required for electron-updater (Squirrel.Mac); dmg is manual install only.
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  # latest-mac.yml must list .zip, not .dmg.
  writeUpdateInfo: false
win:
  icon: icon.ico
  # Keep true so rcedit writes icon.ico into Pix.exe (taskbar + Start Menu).
  # false skips resource editing and leaves Electron's default atom icon.
  signAndEditExecutable: true
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  deleteAppDataOnUninstall: false
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
  installerHeaderIcon: icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Pix
linux:
  icon: icon.png
  executableName: Pix
  maintainer: num-scope <noreply@users.noreply.github.com>
  # AppImage writes latest-linux.yml; deb is manual install convenience.
  target:
    - AppImage
    - deb
  category: Development
  synopsis: Desktop shell for the pi coding agent
  description: Pix is a desktop shell for the pi coding agent.
# node-pty's spawn-helper must live outside asar and remain executable.
# Missing +x → terminal mode: "posix_spawnp failed".
asarUnpack:
  - "**/*.node"
  - "**/node-pty/prebuilds/**"
  - "**/node-pty/build/**"
  - "**/spawn-helper"
  - "**/@silvia-odwyer/photon-node/**"
afterPack: scripts/after-pack.mjs
