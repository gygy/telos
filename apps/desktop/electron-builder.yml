appId: dev.pix.app
productName: Pix
# package.json name is @pix/desktop — override so AppImage/deb paths stay valid.
executableName: Pix
asar: true
# Native dependencies ship N-API/prebuilt binaries and are exercised under the
# target Electron runtime. Rebuilding node-pty discards those prebuilds and adds
# a Visual Studio Spectre-library requirement to packaging.
npmRebuild: false
files:
  - dist/**
  - package.json
# Runtime window / notification icons (BrowserWindow.icon). Separate from the
# exe-embedded icon from win.icon — both are required on Windows for taskbar.
extraResources:
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon.png
    to: icon.png
  - from: build/icon.icns
    to: icon.icns
directories:
  output: release/app
  buildResources: build
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
# electron-updater reads GitHub Releases (latest.yml / latest-mac.yml / latest-linux.yml).
# CI still packages with `--publish never`; softprops uploads artifacts + update metadata.
# app-update.yml is written by electron-builder for dmg/zip/nsis targets, and always by
# scripts/after-pack.mjs so `package:dir` installs can check for updates too.
publish:
  provider: github
  owner: num-scope
  repo: pix
  releaseType: release
mac:
  identity: null
  icon: icon.icns
  # zip is required for electron-updater on macOS; dmg remains the manual installer.
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  writeUpdateInfo: true
win:
  icon: icon.ico
  # Keep true so rcedit writes icon.ico into Pix.exe (taskbar + Start Menu).
  # false skips resource editing and leaves Electron's default atom icon.
  signAndEditExecutable: true
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  deleteAppDataOnUninstall: false
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
  installerHeaderIcon: icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Pix
linux:
  icon: icon.png
  executableName: Pix
  maintainer: num-scope <noreply@users.noreply.github.com>
  target:
    - AppImage
    - deb
  category: Development
  synopsis: Desktop shell for the pi coding agent
  description: Pix is a desktop shell for the pi coding agent.
# node-pty's spawn-helper must live outside asar and remain executable.
# Missing +x → terminal mode: "posix_spawnp failed".
asarUnpack:
  - "**/*.node"
  - "**/node-pty/prebuilds/**"
  - "**/node-pty/build/**"
  - "**/spawn-helper"
  - "**/@silvia-odwyer/photon-node/**"
afterPack: scripts/after-pack.mjs
