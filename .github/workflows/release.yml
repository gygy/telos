# Tag-driven multi-platform installers + GitHub Release.
# Push a tag like v0.1.0 → build NSIS / DMG+zip / AppImage+deb + update metadata → attach to the release.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/../.cache/electron-builder
      ELECTRON_CACHE: ${{ github.workspace }}/../.cache/electron
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: macos-15-intel
            platform: mac

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Install Electron binary
        run: pnpm electron:install

      - name: Package desktop installers
        run: pnpm package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Collect installers and update metadata
        shell: bash
        run: |
          set -euo pipefail
          out="apps/desktop/release/app"
          if [[ ! -d "$out" ]]; then
            echo "Missing package output: $out" >&2
            exit 1
          fi
          mkdir -p artifacts
          shopt -s nullglob
          # Installers + electron-updater metadata (yml/blockmap) + mac zip feed.
          matched=(
            "$out"/*.exe
            "$out"/*.dmg
            "$out"/*.AppImage
            "$out"/*.deb
            "$out"/*.zip
            "$out"/*.yml
            "$out"/*.yaml
            "$out"/*.blockmap
          )
          if [[ ${#matched[@]} -eq 0 ]]; then
            echo "No installer artifacts under $out" >&2
            ls -la "$out" >&2 || true
            exit 1
          fi
          for file in "${matched[@]}"; do
            base="$(basename "$file")"
            # Arch-split mac runners each emit latest-mac.yml — rename so publish can merge.
            if [[ "$base" == "latest-mac.yml" || "$base" == "latest-mac.yaml" ]]; then
              cp -f "$file" "artifacts/latest-mac-${{ runner.arch }}.yml"
              ls -lh "artifacts/latest-mac-${{ runner.arch }}.yml"
              continue
            fi
            cp -f "$file" "artifacts/$base"
            ls -lh "artifacts/$base"
          done

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: pix-${{ matrix.platform }}-${{ runner.arch }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish release
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all platform archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: pix-*
          merge-multiple: true

      - name: Merge latest-mac.yml for multi-arch
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mac_yml=(release-assets/latest-mac-*.yml)
          if [[ ${#mac_yml[@]} -eq 0 ]]; then
            echo "No mac update yml found (ok if mac packaging skipped)"
            ls -la release-assets || true
            exit 0
          fi
          node scripts/merge-latest-mac-yml.mjs release-assets release-assets/latest-mac.yml
          # Keep only the merged feed name on the release.
          rm -f release-assets/latest-mac-*.yml
          ls -lh release-assets/latest-mac.yml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
